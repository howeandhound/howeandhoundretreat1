<style>
    #hazelScrollToTop {
        display: none;
        position: fixed;
        bottom: 35px;
        right: 30px;
        z-index: 99;
        border: none;
        outline: none;
        background-color: #434343;
        color: #FFFFFF;
        cursor: pointer;
        padding: 0px 10px;
        border-radius: 10px;
        font-size: 30px;
        font-weight: bold;
        opacity: 0.6;
    }
    #hazelScrollToTop:hover {
        opacity: 0.9;
    }
</style>

<body>
<script src="hazel_header/hazel_header_body.js"></script>

<button id="hazelScrollToTop" style="display: none;" onclick="topFunction()"><i class="fas fa-arrow-up"></i></button>

<script>
    window.onscroll = function() { scrollFunction(); };
    function scrollFunction() {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            document.getElementById('hazelScrollToTop').style.display = 'block';
        } else {
            document.getElementById('hazelScrollToTop').style.display = 'none';
        }
    }
    function topFunction() {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
    }
</script>
